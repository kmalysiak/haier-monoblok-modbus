esphome:
  name: haier-sniffer
  friendly_name: haier-sniffer

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: DEBUG
  # Wylaczamy halasliwy raw hex-dump UART, bo mamy teraz wlasny parser.
  # Jesli chcesz go tymczasowo z powrotem, ustaw ponizszy poziom na DEBUG.
  logs:
    uart_debug: WARN

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "haier-sniffer Fallback Hotspot"
    password: !secret ota_password

captive_portal:

# -------------------------------------------------------------------------
# UART - pasywny odbior (TX skonfigurowany bo wymagany przez komponent,
# fizycznie niepodlaczony / nieuzywany - sniffer nigdy nie nadaje)
# -------------------------------------------------------------------------
uart:
  id: mod_bus
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 9600
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 512

# -------------------------------------------------------------------------
# LEDy statusowe
# -------------------------------------------------------------------------
output:
  - platform: gpio
    pin: GPIO4
    id: led_modbus_activity_out
  - platform: gpio
    pin: GPIO18
    id: led_wifi_status_out

light:
  - platform: binary
    name: "Modbus Activity LED"
    output: led_modbus_activity_out
    id: led_modbus_activity
    internal: true
  - platform: binary
    name: "WiFi MQTT Status LED"
    output: led_wifi_status_out
    id: led_wifi_status
    internal: true

# (definicja interval: scalona w jeden blok nizej, po globals:)

# -------------------------------------------------------------------------
# Bufor surowych bajtow + zdekodowane wartosci (wypelniane przez parser,
# odczytywane przez publisher co 2s - patrz blok interval: nizej)
# -------------------------------------------------------------------------
globals:
  - id: rx_buf
    type: std::vector<uint8_t>
    restore_value: no
    # UWAGA: celowo BEZ initial_value. "initial_value: '{}'" generuje w C++
    # niejednoznaczne wywolanie konstruktora GlobalsComponent<std::vector<uint8_t>>
    # (blad kompilacji: "call of overloaded ... is ambiguous"). Bez initial_value
    # ESPHome default-konstruuje komponent, co dla std::vector daje pusty wektor
    # - dokladnie to, o co nam chodzi.

  # znane, zmapowane bloki rejestrow
  - {id: g_heatpump_mode,     type: int,   initial_value: '0'}
  - {id: g_antifreeze_on,     type: bool, initial_value: 'false'}  # bit3 R141 MSB (PyHaier: GetAntifreeze.py)
  - {id: g_operational_status,type: int,   initial_value: '0'}
  - {id: g_heater_on,          type: bool, initial_value: 'false'}  # bit0 R144 MSB - grzałka oporowa (PyHaier: GetHeater.py, "Heater A04")
  - {id: g_hours_run,         type: int,   initial_value: '0'}
  - {id: g_twi,               type: float, initial_value: '0'}
  - {id: g_two,               type: float, initial_value: '0'}
  - {id: g_dhw_buffer_temp,   type: float, initial_value: '0'}
  - {id: g_tust_wylot,        type: float, initial_value: '0'}
  - {id: g_dhw_setpoint,      type: float, initial_value: '0'}
  - {id: g_energy_mode,       type: int,   initial_value: '0'}
  - {id: g_current_error,     type: int,   initial_value: '0'}
  - {id: g_eev_level,         type: int,   initial_value: '0'}
  - {id: g_pdset,             type: float, initial_value: '0'}
  - {id: g_pdact,             type: float, initial_value: '0'}
  - {id: g_tsat_target_pd,    type: float, initial_value: '0'}
  - {id: g_tsat_actual_pd,    type: float, initial_value: '0'}
  - {id: g_pst,               type: float, initial_value: '0'}
  - {id: g_psa,               type: float, initial_value: '0'}
  - {id: g_tsat_target_ps,    type: float, initial_value: '0'}
  - {id: g_tsat_actual_ps,    type: float, initial_value: '0'}
  - {id: g_td,                type: float, initial_value: '0'}
  - {id: g_ts,                type: float, initial_value: '0'}
  - {id: g_tao,               type: float, initial_value: '0'}
  - {id: g_tdef,              type: float, initial_value: '0'}
  - {id: g_compressor_temp,   type: float, initial_value: '0'}
  - {id: g_compressor_current,type: float, initial_value: '0'}
  - {id: g_compressor_voltage,type: float, initial_value: '0'}
  - {id: g_comp_set_freq,     type: int,   initial_value: '0'}
  - {id: g_comp_act_freq,     type: int,   initial_value: '0'}
  - {id: g_fan1_rpm,          type: int,   initial_value: '0'}
  - {id: g_fan2_rpm,          type: int,   initial_value: '0'}

  # --- rozszerzenie: reszta rejestrow z bloku 101-106 ---
  - {id: g_r101_l,          type: int,   initial_value: '0'}  # CombinedState (LSB R101) - znaczenie bitow ustalone (patrz niżej)
  - {id: g_dhw_tank_active, type: bool,  initial_value: 'false'}  # bit7 R101 combined state (PyHaier: GetState.py, "TANK")

  # ─── nowe: znalezione przy pelnym porownaniu z PyHaier ───
  - {id: g_val3way_dhw,     type: bool,  initial_value: 'false'}  # bit1 R141 MSB (PyHaier: Get3way.py)
  - {id: g_val3way_ch,      type: bool,  initial_value: 'false'}  # bit2 R141 MSB (PyHaier: Get3way.py)
  - {id: g_defrost_active,  type: bool,  initial_value: 'false'}  # bit5 R141 MSB (PyHaier: GetDefrost.py)
  - {id: g_pump_on,         type: bool,  initial_value: 'false'}  # bit1 R144 MSB (PyHaier: GetPump.py)
  - {id: g_firmware_version,type: float, initial_value: '0'}      # R259 MSB /10 (PyHaier: GetFirmware.py)
  - {id: g_r141_l,          type: int,   initial_value: '0'}      # R141 LSB - DRUGI kod bledu (PyHaier: GetError.py) - rozny rejestr niz Current Error Code
  - {id: g_dhw_compensation,type: float, initial_value: '0'}      # R106 LSB, (x-30)*0.5 (PyHaier: GetDHWCompensation.py "A0d") - nowy parametr
  - {id: g_dhw_setpoint_alt,type: float, initial_value: '0'}      # R106 MSB *0.5 (PyHaier: GetDHWTemp.py) - SPRZECZNE z DHW Setpoint (R105), patrz komentarz przy sensorze
  - {id: g_temp_comp_alt,   type: float, initial_value: '0'}      # R102 LSB, (x-30)*0.5 (PyHaier: GetTempCompensation.py "A03") - SPRZECZNE z Cooling Outlet Setpoint (ten sam bajt)
  - {id: g_cooling_setpoint,type: float, initial_value: '0'}  # CoolingTempSetPoint (R102 LSB)
  - {id: g_r103,            type: float, initial_value: '0'}  # R103, pelny rejestr *0.5, znaczenie nieustalone
  - {id: g_r104,            type: float, initial_value: '0'}  # R104, pelny rejestr *0.5, znaczenie nieustalone
  - {id: g_r105_h,          type: int,   initial_value: '0'}  # R105 MSB, raw, znaczenie nieustalone
  - {id: g_r106,            type: int,   initial_value: '0'}  # R106, pelny rejestr raw (bez mnoznika), znaczenie nieustalone

  # --- rozszerzenie: reszta rejestrow z bloku 141-156 ---
  - {id: g_r142,            type: int,   initial_value: '0'}
  - {id: g_r143,            type: int,   initial_value: '0'}
  - {id: g_r145,            type: int,   initial_value: '0'}
  - {id: g_r146_h,          type: int,   initial_value: '0'}
  - {id: g_thi,             type: float, initial_value: '0'}  # Thi - temp. gazu wlot wymiennika (SPEKULACJA, patrz uwaga w kodzie)
  - {id: g_tho,             type: float, initial_value: '0'}  # Tho - temp. gazu wylot wymiennika (SPEKULACJA)
  - {id: g_r149_l,          type: int,   initial_value: '0'}
  - {id: g_hours_run2,      type: int,   initial_value: '0'}  # R151 MSB - drugi (zdublowany) licznik godzin
  - {id: g_r152,            type: int,   initial_value: '0'}
  - {id: g_r153,            type: int,   initial_value: '0'}
  - {id: g_r155_h,          type: int,   initial_value: '0'}
  - {id: g_r155_l_bitmask,  type: int,   initial_value: '0'}
  - {id: g_r156_bitmask,    type: int,   initial_value: '0'}

  # --- rozszerzenie: R201 ---
  - {id: g_r201_h, type: int, initial_value: '0'}

  # --- rozszerzenie: reszta rejestrow z bloku 241-262 ---
  - {id: g_r242,          type: int, initial_value: '0'}  # "aktualny blad" wg PDF - wartosc widziana tez przy podlaczaniu ATW
  - {id: g_r245_l,        type: int, initial_value: '0'}
  - {id: g_r254_l,        type: int, initial_value: '0'}  # wg PDF bywa "0 chwilowo" - niestabilne
  - {id: g_r255_h,        type: int, initial_value: '0'}
  - {id: g_r257,          type: int, initial_value: '0'}
  - {id: g_r258,          type: int, initial_value: '0'}
  - {id: g_r259,          type: int, initial_value: '0'}
  - {id: g_error_hist_1,  type: int, initial_value: '0'}  # historia bledow, bajt 1 (najstarszy z widocznych)
  - {id: g_error_hist_2,  type: int, initial_value: '0'}
  - {id: g_error_hist_3,  type: int, initial_value: '0'}
  - {id: g_error_hist_4,  type: int, initial_value: '0'}
  - {id: g_error_hist_5,  type: int, initial_value: '0'}
  - {id: g_error_hist_6,  type: int, initial_value: '0'}  # najnowszy bajt historii bledow

  # licznik ramek z kazdego znanego bloku - przydatne do sprawdzenia,
  # czy pilot faktycznie odpytuje o cos wiecej niz nasze 4 bloki
  - {id: g_frames_101, type: int, initial_value: '0'}
  - {id: g_frames_141, type: int, initial_value: '0'}
  - {id: g_frames_201, type: int, initial_value: '0'}
  - {id: g_frames_241, type: int, initial_value: '0'}

  # nieznane zapytania
  - {id: g_unknown_count,  type: int, initial_value: '0'}
  - {id: g_last_unknown,   type: std::string, initial_value: '""'}

# -------------------------------------------------------------------------
# JEDEN blok interval: (WAZNE - w YAML klucz najwyzszego poziomu moze
# wystapic tylko raz; trzy oddzielne "interval:" nadpisywalyby sie nawzajem
# i tylko ostatni by zadzialal). Zawiera trzy zadania:
#   1) co 5s   - podbicie diody statusu WiFi
#   2) co 20ms - PARSER: skladanie ramek Modbus, dekodowanie, CRC
#   3) co 2s   - PUBLISHER: przepisanie zdekodowanych wartosci do sensorow HA
# -------------------------------------------------------------------------
interval:
  - interval: 5s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - light.turn_on: led_wifi_status
          else:
            - light.turn_off: led_wifi_status

  - interval: 20ms
    then:
      - lambda: |-
          auto &buf = id(rx_buf);

          // 1) Wciagnij wszystko co czeka w UART
          uint8_t rxb;
          while (id(mod_bus).available()) {
            if (id(mod_bus).read_byte(&rxb)) {
              buf.push_back(rxb);
            }
          }
          // bezpiecznik - nie pozwol buforowi rosnac w nieskonczonosc,
          // gdyby cos poszlo nie tak z synchronizacja
          if (buf.size() > 1000) {
            buf.erase(buf.begin(), buf.begin() + (buf.size() - 500));
          }
          if (buf.size() < 8) return;

          // CRC16 Modbus (poly 0xA001, init 0xFFFF, little-endian w ramce)
          auto crc16 = [](const uint8_t *data, size_t len) -> uint16_t {
            uint16_t crc = 0xFFFF;
            for (size_t k = 0; k < len; k++) {
              crc ^= data[k];
              for (int b = 0; b < 8; b++) {
                if (crc & 1) crc = (crc >> 1) ^ 0xA001;
                else crc >>= 1;
              }
            }
            return crc;
          };

          bool keep_going = true;
          int iterations = 0;
          while (keep_going && iterations < 200) {
            iterations++;
            keep_going = false;

            if (buf.size() < 8) break;

            // Szukamy poprawnej ramki ZAPYTANIA: 11 03 [addr_hi][addr_lo][qty_hi][qty_lo][crc_lo][crc_hi]
            if (buf[0] != 0x11 || buf[1] != 0x03) {
              buf.erase(buf.begin());
              keep_going = true;
              continue;
            }
            uint16_t crc_calc = crc16(buf.data(), 6);
            uint16_t crc_recv = buf[6] | (buf[7] << 8);
            if (crc_calc != crc_recv) {
              buf.erase(buf.begin());
              keep_going = true;
              continue;
            }

            int start_addr = (buf[2] << 8) | buf[3];
            int qty = (buf[4] << 8) | buf[5];

            // Szukamy odpowiedzi w niewielkim oknie po zapytaniu (24 bajty).
            // POPRAWKA: nie bierzemy juz pierwszego napotkanego bajtu 0x11 jako
            // "start odpowiedzi" - to moglby byc przypadkowy bajt danych (payload
            // to dowolne bajty 0-255, wiec 0x11 moze sie w nich zdarzyc). Zamiast
            // tego probujemy KAZDEGO kandydata 0x11 w oknie i akceptujemy dopiero
            // ten, dla ktorego cala ramka w pelni sie zgadza: funkcja (03 lub 83),
            // spojnosc byte_count z qty (dla 03) i poprawne CRC16.
            const size_t search_window = 24;
            bool resolved = false;       // znalezlismy w pelni poprawna ramke
            bool need_more_data = false; // czekamy na kolejne bajty z UART
            bool is_exception = false;
            size_t rp = 0;
            int byte_count = 0;
            size_t resp_total = 0;

            for (size_t off = 0; off < search_window; off++) {
              size_t p = 8 + off;
              if (buf.size() < p + 1) { need_more_data = true; break; }
              if (buf[p] != 0x11) continue;  // nie kandydat - szukaj dalej

              if (buf.size() < p + 2) { need_more_data = true; break; }

              if (buf[p + 1] == 0x83) {
                // Kandydat na WYJATEK: 11 83 [kod] [crc_lo][crc_hi] = 5 bajtow
                if (buf.size() < p + 5) { need_more_data = true; break; }
                uint16_t exc_crc_calc = crc16(&buf[p], 3);
                uint16_t exc_crc_recv = buf[p + 3] | (buf[p + 4] << 8);
                if (exc_crc_calc == exc_crc_recv) {
                  rp = p;
                  is_exception = true;
                  resolved = true;
                  break;
                }
                continue;  // CRC sie nie zgadza - przypadkowy bajt, szukaj dalej

              } else if (buf[p + 1] == 0x03) {
                // Kandydat na NORMALNA odpowiedz
                if (buf.size() < p + 3) { need_more_data = true; break; }
                int bc = buf[p + 2];
                // POPRAWKA: walidacja byte_count PRZED czekaniem na reszte bajtow.
                // Bez tego przypadkowy bajt danych odczytany jako ogromny byte_count
                // (np. 0xFF=255) blokowalby CALE okno przeszukiwania w oczekiwaniu
                // na bajty, ktore moga nigdy nie nadejsc - uniemozliwiajac sprawdzenie
                // kolejnych kandydatow 0x11, w tym prawdziwej odpowiedzi dalej w oknie.
                // qty znamy juz ze zwalidowanego CRC zapytania, wiec zadamy dokladnie
                // bc == qty*2 (scislej niz ogolny limit Modbus 125 rej. = 250 bajtow).
                if (bc == 0 || bc > 250 || (bc & 1) || bc != qty * 2) {
                  continue;  // niemozliwy/niezgodny byte_count - przypadkowy bajt, szukaj dalej
                }
                size_t total = 3 + bc + 2;
                if (buf.size() < p + total) { need_more_data = true; break; }
                uint16_t rcrc_calc = crc16(&buf[p], 3 + bc);
                uint16_t rcrc_recv = buf[p + 3 + bc] | (buf[p + 3 + bc + 1] << 8);
                if (rcrc_calc == rcrc_recv) {
                  rp = p;
                  byte_count = bc;
                  resp_total = total;
                  resolved = true;
                  break;
                }
                continue;  // CRC sie nie zgadza - przypadkowy bajt, szukaj dalej

              } else {
                continue;  // ani 03 ani 83 po tym 0x11 - przypadkowy bajt
              }
            }

            if (need_more_data) break;  // sprobujemy ponownie za 20ms, gdy dojda kolejne bajty

            if (!resolved) {
              // w calym oknie nie znaleziono ZADNEJ w pelni poprawnej ramki
              // - odrzuc bajty zapytania i szukaj dalej od nowa
              buf.erase(buf.begin(), buf.begin() + 8);
              keep_going = true;
              continue;
            }

            if (is_exception) {
              ESP_LOGW("modbus_exc",
                       "Modbus exception: slave=0x%02X function=0x%02X code=0x%02X "
                       "(start_addr=%d qty=%d)",
                       buf[rp], buf[rp + 1], buf[rp + 2], start_addr, qty);
              buf.erase(buf.begin(), buf.begin() + rp + 5);
              keep_going = true;
              continue;
            }

            // ---- mamy w pelni zwalidowana pare zapytanie + odpowiedz ----
            std::vector<uint8_t> data(buf.begin() + rp + 3,
                                       buf.begin() + rp + 3 + byte_count);

            id(led_modbus_activity).turn_on().perform();

            // funkcja dekodujaca 12-bit U2 (patrz elektroda.pl topic3994059,
            // posty #31 lopr_pol i #35 gaspaccio)
            auto u2 = [](uint8_t main_byte, uint8_t nibble_byte,
                         bool msn, float mult) -> float {
              uint8_t sb = msn ? ((nibble_byte >> 4) & 0x0F) : (nibble_byte & 0x0F);
              uint8_t lb = main_byte;
              int32_t raw;
              if (sb & 0x8) {
                sb ^= 0x0F;
                lb ^= 0xFF;
                raw = -((256 * (int32_t) sb + lb) + 1);
              } else {
                raw = 256 * (int32_t) sb + lb;
              }
              return raw * mult;
            };

            if (start_addr == 101 && data.size() == 12) {
              id(g_frames_101) += 1;
              // Rejestry 101-106, zgodnie z HpRegistersIndex.txt (nz51ww/GrzMiL)
              id(g_r101_l)          = data[1];               // CombinedState_R101_L (raw)
              // Bity ustalone wg PyHaier GetState.py: bit0=ON/OFF, bit1=cool, bit2=heat, bit7=tank(CWU)
              id(g_dhw_tank_active) = (data[1] & 0x80) != 0;
              id(g_tust_wylot)      = data[2] * 0.5f;         // HeatingTempSetPoint_R102_H
              id(g_cooling_setpoint)= data[3] * 0.5f;         // CoolingTempSetPoint_R102_L
              id(g_temp_comp_alt)   = ((int)data[3] - 30) * 0.5f;  // ALT: PyHaier GetTempCompensation.py - patrz komentarz przy sensorze
              id(g_r103)  = ((data[4] << 8) | data[5]) * 0.5f;  // R103 pelny rejestr
              id(g_r104)  = ((data[6] << 8) | data[7]) * 0.5f;  // R104 pelny rejestr
              id(g_r105_h) = data[8];                          // R105_H (raw)
              id(g_dhw_setpoint) = data[9] * 0.5f;             // DhwTempSetPoint_R105_L
                                                                 // (POPRAWKA: poprzednio blednie data[11],
                                                                 //  co dawalo nierealne 15C zamiast ~45C)
              id(g_r106)  = (data[10] << 8) | data[11];         // R106 pelny rejestr, raw (bez mnoznika)
              id(g_dhw_setpoint_alt) = data[10] * 0.5f;          // ALT: PyHaier GetDHWTemp.py (R106 MSB) - SPRZECZNE z DHW Setpoint (R105)
              id(g_dhw_compensation) = ((int)data[11] - 30) * 0.5f;  // PyHaier GetDHWCompensation.py "A0d" (R106 LSB) - nowy, bez konfliktu

            } else if (start_addr == 141 && data.size() == 32) {
              id(g_frames_141) += 1;
              id(g_heatpump_mode)      = data[0];
              id(g_antifreeze_on)      = (data[0] & 0x08) != 0;  // bit3 R141 MSB
              id(g_val3way_dhw)        = (data[0] & 0x02) != 0;  // bit1 R141 MSB (Get3way.py)
              id(g_val3way_ch)         = (data[0] & 0x04) != 0;  // bit2 R141 MSB (Get3way.py)
              id(g_defrost_active)     = (data[0] & 0x20) != 0;  // bit5 R141 MSB (GetDefrost.py)
              id(g_r141_l)             = data[1];                // GetError.py - DRUGI kod bledu, rozny rejestr niz Current Error Code
              id(g_operational_status) = data[6];
              id(g_heater_on)          = (data[6] & 0x01) != 0;  // bit0 R144 MSB - grzałka oporowa
              id(g_pump_on)            = (data[6] & 0x02) != 0;  // bit1 R144 MSB (GetPump.py) - pompa obiegowa
              id(g_r142) = (data[2] << 8) | data[3];
              id(g_r143) = (data[4] << 8) | data[5];
              id(g_r145) = (data[8] << 8) | data[9];
              id(g_r146_h) = data[10];
              id(g_twi) = u2(data[12], data[11], false, 0.1f);  // LSN R146_L + R147_H (PyHaier: GetTwiTwo.py)
              id(g_two) = u2(data[13], data[11], true,  0.1f);  // MSN R146_L + R147_L
              // Thi/Tho: zweryfikowane wg PyHaier GetThiTho.py (wczesniej: SPEKULACJA, teraz potwierdzone)
              id(g_thi) = u2(data[15], data[14], false, 0.1f);  // LSN R148_H + R148_L
              id(g_tho) = u2(data[16], data[14], true,  0.1f);  // MSN R148_H + R149_H
              id(g_r149_l) = data[17];
              id(g_hours_run)  = data[18];  // R150 MSB
              id(g_hours_run2) = data[20];  // R151 MSB - potwierdzone przez lopr_pol jako duplikat
              id(g_r152) = (data[22] << 8) | data[23];
              id(g_r153) = (data[24] << 8) | data[25];
              id(g_dhw_buffer_temp) = ((data[26] << 8) | data[27]) * 0.1f;
              id(g_r155_h) = data[28];
              id(g_r155_l_bitmask) = data[29];
              id(g_r156_bitmask) = (data[30] << 8) | data[31];

            } else if (start_addr == 201 && data.size() == 2) {
              id(g_frames_201) += 1;
              id(g_r201_h) = data[0];
              id(g_energy_mode) = data[1];

            } else if (start_addr == 241 && data.size() == 44) {
              id(g_frames_241) += 1;
              id(g_current_error) = data[1];
              id(g_r242) = (data[2] << 8) | data[3];
              id(g_eev_level) = data[10];
              id(g_pdset) = data[11] * 0.2f;
              id(g_pdact) = data[12] * 0.2f;
              id(g_pst)   = data[16] * 0.2f;
              id(g_psa)   = data[17] * 0.2f;
              // Temperatury nasycenia (saturation temp) dla Pd/Ps - zweryfikowane
              // wg PyHaier GetTSatPd.py / GetTSatPs.py (wczesniej pominiete,
              // bo nie mialem pewnego przypisania nibble - teraz mam)
              id(g_tsat_target_pd) = u2(data[14], data[13], false, 0.1f);  // LSN R247_L + R248_H
              id(g_tsat_actual_pd) = u2(data[15], data[13], true,  0.1f);  // MSN R247_L + R248_L
              id(g_tsat_target_ps) = u2(data[19], data[18], false, 0.1f);  // LSN R250_H + R250_L
              id(g_tsat_actual_ps) = u2(data[20], data[18], true,  0.1f);  // MSN R250_H + R251_H
              id(g_td)   = u2(data[22], data[21], false, 0.1f);  // LSN R251_L + R252_H (PyHaier: GetTdTs.py)
              id(g_ts)   = u2(data[23], data[21], true,  0.1f);  // MSN R251_L + R252_L
              id(g_tao)  = u2(data[25], data[24], false, 0.1f);  // LSN R253_H + R253_L (PyHaier: GetTao.py)
              id(g_tdef) = u2(data[26], data[24], true,  0.1f);  // MSN R253_H + R254_H (PyHaier: GetTdef.py)
              id(g_r245_l) = data[9];
              id(g_r254_l) = data[27];
              id(g_r255_h) = data[28];
              id(g_compressor_temp)    = data[29] * 0.1f;
              id(g_compressor_current) = data[30] * 0.2f;
              id(g_compressor_voltage) = data[31] * 4.0f;  // POPRAWKA: bylo *0.4 (10x za malo).
                                                             // PyHaier GetCompInfo.py: compvolt = R256_L * 4
              id(g_r257) = (data[32] << 8) | data[33];
              id(g_r258) = (data[34] << 8) | data[35];
              id(g_r259) = (data[36] << 8) | data[37];
              id(g_error_hist_1) = data[38];
              id(g_error_hist_2) = data[39];
              id(g_error_hist_3) = data[40];
              id(g_error_hist_4) = data[41];
              id(g_error_hist_5) = data[42];
              id(g_error_hist_6) = data[43];
              id(g_firmware_version) = data[36] * 0.1f;  // R259 MSB /10 (GetFirmware.py) - ten sam bajt co "R259 (raw)" powyzej
              id(g_comp_set_freq) = data[6];   // R244 MSB = fset (PyHaier: GetCompInfo.py payload[3].MSB)
              id(g_comp_act_freq) = data[5];   // R243 LSB = fact (PyHaier: GetCompInfo.py payload[2].LSB)
                                                 // POPRAWKA: wczesniej odwrotnie
              id(g_fan1_rpm) = data[7] * 5;
              id(g_fan2_rpm) = data[8] * 5;

            } else {
              // --- NIEZNANY ADRES STARTOWY - to jest to, czego szukamy ---
              id(g_unknown_count) += 1;
              char hb[4];
              std::string hexstr;
              for (auto b : data) {
                sprintf(hb, "%02X ", b);
                hexstr += hb;
              }
              id(g_last_unknown) =
                  "addr=" + std::to_string(start_addr) +
                  " qty=" + std::to_string(qty) +
                  " data=" + hexstr;
            }

            size_t consumed = rp + resp_total;
            buf.erase(buf.begin(), buf.begin() + consumed);
            keep_going = true;
          }

